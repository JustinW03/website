<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>JustinZockt Server-Overlay (TikTok)</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   CONFIG  –  HIER KANNST DU ALLES ÄNDERN (ohne Programmierkenntnisse)
   ---------------------------------------------------------------------
   Regeln:
   - Texte immer in "Anführungszeichen" lassen.
   - Nach jeder Zeile steht ein Komma , – nicht löschen.
   - true = an, false = aus.
   - Text zwischen *Sternchen* wird in der Hauptfarbe (rot) geschrieben.
   - Format: "1:1" (quadratisch 1080 x 1080), "9:16" (Hochformat
     1080 x 1920) oder "16:9" (Querformat 1920 x 1080).
     Auch per Link umschaltbar: ...tiktok-overlay.html?format=9:16
     Die Browserquelle in TikTok LIVE Studio muss dieselbe Größe haben.
   ===================================================================== */
var CONFIG = {

  // Format: "1:1", "9:16" oder "16:9"
  format: "1:1",

  // Abstand von oben (Pixel) je Format. Bei 9:16 nicht unter ~230, sonst verdeckt die TikTok-Profilzeile alles.
  abstandOben: { "1:1": 90, "9:16": 250, "16:9": 90 },

  // Größe: 1 = normal, 0.9 = kleiner, 1.1 = größer
  skalierung: 1,

  // Sekunden, die jede Karte sichtbar ist
  dauer: 4,

  // Sekunden Pause zwischen zwei Karten (Karte ist dann weg, Bild frei). 0 = direkt wechseln
  pauseZwischenKarten: 0,

  // Farben (Hex-Code mit #)
  farben: {
    haupt:       "#ff1f3d",
    dunkel:      "#b3001b",
    hintergrund: "#0e0e12",
    text:        "#ffffff",
    textGrau:    "#d2d2db"
  },

  // Deckkraft der Hintergründe (0 = durchsichtig, 1 = deckend)
  deckkraft: 0.88,

  // Banner oben
  banner: {
    an: true,
    kicker: "SPIEL MIT AUF MEINEM SERVER",
    titel:  "JustinZockt *Community*",
    badge:  "KOSTENLOS"
  },

  // Elemente an/aus
  zeigePartikel:    true,
  zeigeShine:       true,
  zeigeGlow:        true,
  zeigeFortschritt: true,
  zeigeKarten:      true,

  // Die Karten, die nacheinander eingeblendet werden (an: false = überspringen)
  botschaften: [
    { an: true, label: "SERVER-IP",       text: "play.*justinzockt*.de",    unter: "Java Edition 26.3 · ältere Versionen ab 1.21.5" },
    { an: true, label: "HANDY & KONSOLE", text: "bedrock.*justinzockt*.de", unter: "Bedrock · Port 15314 · Handy, Konsole & Windows" },
    { an: true, label: "SO KOMMST DU REIN", text: "Whitelist über *Discord*", unter: "Discord-Link auf justinzockt.de · Twitch-Follow nötig" },
    { an: true, label: "FEATURES",        text: "*25+* Minigames",          unter: "Survival mit Clans, Claims, Skills, Shop & Coins · Events" }
  ],

  // Live-Anzeige "Spieler online" (ganz oben, über dem Banner). Bei Fehler verschwindet sie einfach.
  serverStatus: {
    an: true,
    url: "https://api.mcsrvstat.us/3/play.justinzockt.de",
    intervall: 60,
    text: "{n} Spieler gerade online",
    zeigeBeiNull: false
  }
};
/* ====================== ENDE CONFIG – ab hier nichts ändern nötig ====================== */
</script>

<style>
  :root{
    --rot:#ff1f3d; --rot-rgb:255,31,61; --rotd:#b3001b;
    --bg-rgb:14,14,18; --deck:.88; --txt:#fff; --grau:#d2d2db;
    --dauer:4s; --skala:1; --W:1080px; --H:1080px; --oben:90px; --spalte:960px;
  }
  html,body{margin:0;padding:0;width:var(--W);height:var(--H);overflow:hidden;background:transparent;}
  body{font-family:"Montserrat","Segoe UI",Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;}
  body.testbg-dunkel{background:linear-gradient(170deg,#1b2433,#0b0f16 60%,#1d1410);}
  body.testbg-hell{background:linear-gradient(180deg,#bfe3ff 0%,#eef7ff 50%,#ffffff 100%);}
  body.testbg-mc{background:
      linear-gradient(180deg,rgba(120,190,255,1) 0,rgba(180,220,255,1) 45%,transparent 45%),
      repeating-linear-gradient(90deg,#5a9e3a 0 40px,#4f9132 40px 80px);}
  /* zeigt die TikTok-UI-Zonen (nur zum Testen: ?zonen=1) */
  .zone{position:absolute;background:rgba(0,180,255,.18);border:2px dashed rgba(0,180,255,.8);box-sizing:border-box;
    font:700 24px Arial;color:#09f;display:none;align-items:flex-start;justify-content:center;padding-top:8px;z-index:9;}
  .zonen.f916 .zone{display:flex;}

  #ov{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform:scale(var(--skala));transform-origin:50% 0;}
  /* Spalte: Online-Anzeige, Banner, Karte untereinander */
  #spalte{position:absolute;top:var(--oben);left:50%;width:var(--spalte);margin-left:calc(var(--spalte) / -2);
    display:flex;flex-direction:column;align-items:stretch;gap:24px;}

  /* ---------- gemeinsamer Glas-Look ---------- */
  .glas{position:relative;box-sizing:border-box;border-radius:28px;
    background:linear-gradient(115deg,rgba(var(--bg-rgb),var(--deck)) 0%,rgba(var(--bg-rgb),var(--deck)) 55%,rgba(42,6,14,var(--deck)) 100%);
    box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06);}
  .glow{position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:30px;pointer-events:none;
    border:3px solid rgba(var(--rot-rgb),.8);
    box-shadow:0 0 30px rgba(var(--rot-rgb),.55),0 0 70px rgba(var(--rot-rgb),.25),inset 0 0 24px rgba(var(--rot-rgb),.18);
    animation:puls 3.2s ease-in-out infinite;}
  @keyframes puls{0%,100%{opacity:.45;}50%{opacity:1;}}
  .shine{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:28px;overflow:hidden;pointer-events:none;}
  .shine i{position:absolute;top:-20%;bottom:-20%;left:0;width:30%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12) 45%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.12) 55%,transparent);
    transform:translateX(-160%) skewX(-22deg);animation:shine 8s ease-in-out 1.6s infinite;}
  @keyframes shine{0%{transform:translateX(-160%) skewX(-22deg);}18%,100%{transform:translateX(460%) skewX(-22deg);}}

  /* ---------- Banner ---------- */
  #banner{height:160px;padding:22px 28px 22px 24px;display:flex;align-items:center;gap:26px;
    animation:vonOben 1s cubic-bezier(.16,1.25,.35,1) both;}
  @keyframes vonOben{from{opacity:0;transform:translateY(-80px) scale(.94);}to{opacity:1;transform:none;}}
  .icon{position:relative;flex:0 0 auto;width:116px;height:116px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 30% 20%,rgba(var(--rot-rgb),.38),rgba(var(--rot-rgb),.08) 60%,rgba(0,0,0,0));
    box-shadow:inset 0 0 0 2px rgba(var(--rot-rgb),.4);}
  .icon svg{width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:schweben 4s ease-in-out infinite;}
  @keyframes schweben{0%,100%{transform:translateY(3px);}50%{transform:translateY(-4px);}}
  .btext{flex:1 1 auto;min-width:0;}
  .kicker{font-family:"Press Start 2P",monospace;font-size:21px;line-height:26px;color:var(--rot);white-space:nowrap;
    text-shadow:0 0 14px rgba(var(--rot-rgb),.6);}
  .titel{font-weight:900;font-size:50px;line-height:60px;margin-top:10px;white-space:nowrap;overflow:hidden;
    text-shadow:0 3px 0 rgba(0,0,0,.55);}
  .hl{color:var(--rot);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 22px rgba(var(--rot-rgb),.55);}
  .badge{position:absolute;right:26px;top:-19px;font-weight:900;font-size:22px;letter-spacing:2px;padding:7px 16px;border-radius:10px;
    color:#fff;background:linear-gradient(180deg,var(--rot),var(--rotd));box-shadow:0 0 18px rgba(var(--rot-rgb),.65),0 4px 10px rgba(0,0,0,.4);
    animation:wackel 5s ease-in-out 1.5s infinite;}
  @keyframes wackel{0%,86%,100%{transform:rotate(0) scale(1);}89%{transform:rotate(-4deg) scale(1.08);}92%{transform:rotate(4deg) scale(1.08);}95%{transform:rotate(-2deg) scale(1.04);}}

  /* ---------- Status ---------- */
  .status{height:54px;display:flex;justify-content:center;visibility:hidden;}
  .ohne-status .status{display:none;}
  .status.da{visibility:visible;animation:vonOben .8s cubic-bezier(.16,1.25,.35,1) both;}
  .status .pill{display:flex;align-items:center;gap:14px;padding:11px 24px 11px 20px;border-radius:999px;font-weight:800;font-size:26px;white-space:nowrap;
    background:rgba(var(--bg-rgb),var(--deck));box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);}
  .led{position:relative;width:14px;height:14px;border-radius:50%;background:#2bd96b;box-shadow:0 0 10px #2bd96b;}
  .led:after{content:"";position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:3px solid #2bd96b;box-sizing:border-box;animation:ring 2s ease-out infinite;}
  @keyframes ring{from{opacity:.9;transform:scale(.4);}to{opacity:0;transform:scale(1.4);}}
  .rest{color:var(--grau);font-weight:700;}

  /* ---------- Karte ---------- */
  #banner{margin-top:6px;}
  #karte{padding:30px 40px 30px;opacity:0;visibility:hidden;}
  #karte.rein{visibility:visible;animation:karteRein .85s cubic-bezier(.16,1.3,.35,1) both;}
  #karte.raus{visibility:visible;animation:karteRaus .5s ease-in both;}
  @keyframes karteRein{from{opacity:0;transform:translateY(60px) scale(.85) rotateX(30deg);}to{opacity:1;transform:none;}}
  @keyframes karteRaus{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(-40px) scale(.95);}}
  .kante{position:absolute;left:0;top:26px;bottom:26px;width:7px;border-radius:0 6px 6px 0;
    background:linear-gradient(180deg,var(--rot),var(--rotd));box-shadow:0 0 18px rgba(var(--rot-rgb),.8);}
  .lbl{display:inline-block;font-family:"Press Start 2P",monospace;font-size:20px;line-height:20px;padding:11px 14px 9px;border-radius:8px;
    color:var(--rot);background:rgba(var(--rot-rgb),.14);box-shadow:inset 0 0 0 2px rgba(var(--rot-rgb),.6);}
  .main{font-weight:900;font-size:74px;line-height:88px;height:88px;margin-top:16px;white-space:nowrap;overflow:hidden;
    text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.35);}
  .ch{display:inline-block;white-space:pre;}
  #karte.rein .ch{animation:chIn .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i) * 22ms + 250ms);}
  @keyframes chIn{from{opacity:0;transform:translateY(26px) scale(.5);}to{opacity:1;transform:none;}}
  .sub{font-weight:700;font-size:34px;line-height:44px;text-wrap:balance;color:var(--grau);margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.6);}
  #karte.rein .sub,#karte.rein .lbl{animation:subIn .6s ease-out .45s both;}
  #karte.rein .lbl{animation-delay:.15s;}
  @keyframes subIn{from{opacity:0;transform:translateX(-18px);}to{opacity:1;transform:none;}}
  .fuss{display:flex;align-items:center;gap:16px;margin-top:22px;}
  .balken{position:relative;flex:1 1 auto;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
  .balken i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,var(--rotd),var(--rot));box-shadow:0 0 10px rgba(var(--rot-rgb),.9);}
  .balken i.lauf{animation:lauf var(--dauer) linear both;}
  @keyframes lauf{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .punkte{display:flex;gap:9px;}
  .punkte b{width:11px;height:11px;background:rgba(255,255,255,.22);}
  .punkte b.an{background:var(--rot);box-shadow:0 0 10px rgba(var(--rot-rgb),.9);}

  /* Pixel-Funken */
  .funken{position:absolute;left:20px;right:20px;top:0;height:0;pointer-events:none;}
  .funken s{position:absolute;bottom:0;width:9px;height:9px;background:var(--rot);opacity:0;animation:funke var(--d) linear var(--v) infinite;}
  .funken s.w{background:#fff;} .funken s.g{width:7px;height:7px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)),var(--rot);}
  @keyframes funke{0%{opacity:0;transform:translate(0,6px);}12%{opacity:1;}70%{opacity:.85;}100%{opacity:0;transform:translate(var(--x),-90px);}}

  .ohne-funken .funken,.ohne-shine .shine,.ohne-glow .glow,.ohne-fuss .fuss{display:none !important;}
  .statisch #banner,.statisch .ch,.statisch .sub,.statisch .lbl,.statisch .status.da,.statisch .badge{animation:none !important;}
  .statisch #karte{opacity:1;visibility:visible;animation:none !important;}
  .statisch .balken i{animation:none !important;transform:scaleX(.55);}
</style>
</head>
<body>

<script>
(function(){
  "use strict";
  var C = CONFIG, P = {};
  try { location.search.replace(/^\?/,"").split("&").forEach(function(kv){
      if(!kv) return; var p = kv.split("="); P[decodeURIComponent(p[0]).toLowerCase()] = decodeURIComponent((p[1]||"").replace(/\+/g," ")); }); } catch(e){}
  function an(v){ return !(v==="0"||v==="aus"||v==="false"||v==="nein"); }
  function hex(v){ if(!v) return null; v = v.replace(/^#/,""); return /^[0-9a-fA-F]{6}$/.test(v) ? "#"+v : null; }
  function rgb(h){ h=h.replace("#",""); return parseInt(h.substr(0,2),16)+","+parseInt(h.substr(2,2),16)+","+parseInt(h.substr(4,2),16); }

  var dauer = Math.max(2, parseFloat(P.dauer) || C.dauer || 4);
  var pause = P.pause!=null ? (parseFloat(P.pause)||0) : (C.pauseZwischenKarten||0);
  var farbe = hex(P.farbe) || C.farben.haupt, farbe2 = hex(P.farbe2) || C.farben.dunkel;
  var skala = parseFloat(P.skala) || C.skalierung || 1;
  var deck = P.deckkraft!=null ? parseFloat(P.deckkraft) : C.deckkraft;
  var R = document.documentElement.style;
  R.setProperty("--rot", farbe); R.setProperty("--rot-rgb", rgb(farbe)); R.setProperty("--rotd", farbe2);
  R.setProperty("--bg-rgb", rgb(C.farben.hintergrund)); R.setProperty("--txt", C.farben.text); R.setProperty("--grau", C.farben.textGrau);
  R.setProperty("--deck", isNaN(deck)?.88:deck); R.setProperty("--dauer", dauer+"s"); R.setProperty("--skala", skala);
  // Format: 1:1 / 9:16 / 16:9 (Link: ?format=9:16, 9x16, 916, hoch, quer, quadrat)
  var fm = String(P.format || C.format || "1:1").toLowerCase().replace(/\s/g,"").replace(/[x\/_-]/g,":");
  if(fm==="916"||fm==="hoch"||fm==="hochformat") fm="9:16";
  if(fm==="169"||fm==="quer"||fm==="querformat") fm="16:9";
  if(fm!=="9:16" && fm!=="16:9") fm="1:1";
  var masse = { "1:1":[1080,1080,960], "9:16":[1080,1920,960], "16:9":[1920,1080,1180] }[fm];
  var obenStd = (C.abstandOben && C.abstandOben[fm] != null) ? C.abstandOben[fm] : ({ "1:1":90, "9:16":250, "16:9":90 }[fm]);
  R.setProperty("--W", masse[0]+"px"); R.setProperty("--H", masse[1]+"px"); R.setProperty("--spalte", masse[2]+"px");
  R.setProperty("--oben", (P.oben!=null && !isNaN(parseFloat(P.oben)) ? parseFloat(P.oben) : obenStd) + "px");

  var cls = ["f" + fm.replace(":","")];
  if(P.testbg) cls.push("testbg-"+P.testbg);
  if(P.zonen && an(P.zonen)) cls.push("zonen");
  if(!C.zeigePartikel || (P.partikel!=null && !an(P.partikel))) cls.push("ohne-funken");
  if(!C.zeigeShine || (P.shine!=null && !an(P.shine))) cls.push("ohne-shine");
  if(!C.zeigeGlow || (P.glow!=null && !an(P.glow))) cls.push("ohne-glow");
  if(!C.zeigeFortschritt) cls.push("ohne-fuss");
  var statisch = P.slide != null;
  if(statisch) cls.push("statisch");
  document.body.className = cls.join(" ");

  function zeichen(text, el, einzeln){
    el.innerHTML = ""; var teile = String(text).split("*"), i = 0;
    teile.forEach(function(t, n){
      var box = el;
      if(n % 2 === 1){ box = document.createElement("span"); box.className = "hl"; el.appendChild(box); }
      if(!einzeln){ box.appendChild(document.createTextNode(t)); return; }
      for(var k=0;k<t.length;k++){ var s=document.createElement("span"); s.className="ch"; s.style.setProperty("--i", i++); s.textContent=t[k]; box.appendChild(s); }
    });
  }
  function passe(el, start, min, schritt){
    var f = start; el.style.fontSize = f+"px";
    while(el.scrollWidth > el.clientWidth + 1 && f > min){ f -= schritt; el.style.fontSize = f+"px"; }
  }

  // ---------- Banner ----------
  var B = C.banner || {}, banner = document.getElementById("banner");
  if(B.an === false || (P.banner!=null && !an(P.banner))){ banner.style.display = "none"; }
  document.getElementById("kicker").textContent = B.kicker || "";
  zeichen(P.titel || B.titel || "", document.getElementById("titel"), false);
  var badge = document.getElementById("badge"); badge.textContent = B.badge || ""; if(!B.badge) badge.style.display = "none";
  function passeBanner(){ passe(document.getElementById("titel"), 50, 30, 1); passe(document.getElementById("kicker"), 21, 13, .5); }

  // ---------- Karten ----------
  var liste = C.botschaften.filter(function(b){ return b.an !== false; });
  if(P.nur){ var w = P.nur.split(",").map(function(x){return parseInt(x,10)-1;});
    liste = C.botschaften.filter(function(b,i){ return w.indexOf(i)>=0; }); }
  if(!liste.length) liste = [C.botschaften[0]];
  var karte = document.getElementById("karte"), lbl = document.getElementById("lbl"), main = document.getElementById("main"),
      sub = document.getElementById("sub"), balken = document.getElementById("balken"), punkte = document.getElementById("punkte");
  liste.forEach(function(){ punkte.appendChild(document.createElement("b")); });
  if(liste.length < 2) punkte.style.display = "none";
  var akt = 0;
  function fuelle(n){
    var b = liste[n]; akt = n;
    lbl.textContent = b.label || ""; lbl.style.display = b.label ? "inline-block" : "none";
    zeichen(b.text, main, true); sub.textContent = (b.unter || "").replace(/\s·\s/g, String.fromCharCode(160) + "· ");   // "·" nie am Zeilenanfang
    passe(main, 74, 40, 1);
    var pk = punkte.children; for(var i=0;i<pk.length;i++) pk[i].className = (i===n?"an":"");
  }
  function rein(n){
    fuelle(n);
    karte.classList.remove("raus"); karte.classList.remove("rein"); void karte.offsetWidth; karte.classList.add("rein");
    balken.classList.remove("lauf"); void balken.offsetWidth; balken.classList.add("lauf");
  }
  var kartenAn = C.zeigeKarten !== false && (P.karten==null || an(P.karten));
  if(!kartenAn){ karte.style.display = "none"; }
  else if(statisch){ fuelle(Math.min(liste.length, Math.max(1, parseInt(P.slide,10)||1)) - 1); }
  else {
    var schritt = function(){
      if(pause > 0){
        karte.classList.remove("rein"); karte.classList.add("raus");
        setTimeout(function(){ karte.classList.remove("raus"); setTimeout(function(){ rein((akt+1) % liste.length); setTimeout(schritt, dauer*1000); }, pause*1000); }, 500);
      } else { rein((akt+1) % liste.length); setTimeout(schritt, dauer*1000); }
    };
    setTimeout(function(){ rein(0); setTimeout(schritt, dauer*1000); }, 900);
  }
  function allesPassen(){ passeBanner(); if(kartenAn) passe(main, 74, 40, 1); }
  allesPassen();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(allesPassen);
  setTimeout(allesPassen, 1500);

  // ---------- Funken ----------
  if(cls.indexOf("ohne-funken") < 0){
    var fu = document.getElementById("funken");
    for(var i=0;i<18;i++){
      var e = document.createElement("s"), r = Math.random();
      e.className = r < .25 ? "w" : (r < .45 ? "g" : "");
      e.style.left = (3 + Math.random()*94) + "%";
      e.style.setProperty("--d", (2.6 + Math.random()*2.8).toFixed(2)+"s");
      e.style.setProperty("--v", (-Math.random()*5).toFixed(2)+"s");
      e.style.setProperty("--x", ((Math.random()-.5)*60).toFixed(0)+"px");
      fu.appendChild(e);
    }
  }

  // ---------- Server-Status ----------
  var S = C.serverStatus || {}, st = document.getElementById("status"), stt = document.getElementById("statusText");
  if(!S.an || (P.status!=null && !an(P.status) && P.statusdemo==null)) document.body.classList.add("ohne-status");
  function setze(n, max){
    if(n == null || (!S.zeigeBeiNull && n === 0)){ st.classList.remove("da"); return; }
    var t = (S.text || "{n} Spieler online").replace("{max}", max!=null?max:"?").split("{n}");
    stt.innerHTML = "";
    if(t[0]){ var a = document.createElement("span"); a.className = "rest"; a.textContent = t[0]; stt.appendChild(a); }
    var z = document.createElement("span"); z.textContent = n; stt.appendChild(z);
    var b = document.createElement("span"); b.className = "rest"; b.textContent = t[1] || ""; stt.appendChild(b);
    if(!st.classList.contains("da")) st.classList.add("da");
  }
  if(P.statusdemo != null){ setze(parseInt(P.statusdemo,10)||0, 100); }
  else if(S.an && (P.status==null || an(P.status)) && S.url && window.fetch){
    var url = P.statusurl || S.url;
    var lade = function(){
      var ctrl = window.AbortController ? new AbortController() : null;
      var to = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 8000);
      fetch(url, ctrl ? {signal: ctrl.signal, cache: "no-store"} : {cache: "no-store"})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(j){ clearTimeout(to);
          var on = j && (j.online !== false) && j.players;
          var n = on ? (j.players.online != null ? j.players.online : j.players.now) : null;
          setze(typeof n === "number" ? n : null, on ? j.players.max : null); })
        .catch(function(){ clearTimeout(to); st.classList.remove("da"); });
    };
    lade(); setInterval(lade, Math.max(20, S.intervall || 60) * 1000);
  }
})();
